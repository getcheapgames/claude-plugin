name: Blocked-by status
# Keeps the CByte status label in step with GitHub issue dependencies:
#   open issue with an open "blocked by" issue -> status:blocked (Blocked column)
#   all of its blockers closed               -> status:todo   (back to Todo)
# Issues marked Blocked by hand, with no dependencies, are left alone.
# Dependency edits fire no Actions event, so it also runs every 15 minutes.
on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [opened, reopened, closed, edited, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: blocked-by-status
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const statusLabels = ['status:todo', 'status:in-progress', 'status:blocked', 'status:done'];
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            let changed = 0;
            for (const issue of issues) {
              if (issue.pull_request) continue;
              const deps = issue.issue_dependencies_summary || {};
              const openBlockers = deps.blocked_by || 0;
              const anyBlockers = deps.total_blocked_by || 0;
              const names = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
              const isBlocked = names.includes('status:blocked');
              let status = null;
              if (openBlockers > 0 && !isBlocked) status = 'status:blocked';
              else if (openBlockers === 0 && anyBlockers > 0 && isBlocked) status = 'status:todo';
              if (!status) continue;
              const labels = [...names.filter(n => !statusLabels.includes(n)), status];
              await github.rest.issues.update({...context.repo, issue_number: issue.number, labels});
              core.info(`#${issue.number} -> ${status} (open blockers: ${openBlockers})`);
              changed++;
            }
            core.info(`Updated ${changed} issue(s).`);
